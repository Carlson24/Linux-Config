<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
  <!-- 默认系统界面(system-ui)字体 -->
  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Alibaba PuHuiTi 3.0</string>
      <string>sans-serif</string>
    </edit>
  </match>
  <!-- 默认无衬线(sans-serif)字体 -->
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Source Han Sans CN</string>
      <string>Iosevka Aile</string>
      <string>sans-fallback</string>
    </edit>
  </match>
  <!-- 默认衬线(serif)字体 -->
  <match target="pattern">
    <test name="family">
      <string>serif</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>Source Han Serif CN</string>
      <string>Iosevka Etoile</string>
      <string>serif-fallback</string>
    </edit>
  </match>
  <!-- 默认等宽(monospace)字体 -->
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <!-- 使用 常规、无连字、等宽 NF 图标字型 -->
      <string>Maple Mono Normal NL NR NFMono CN</string>
      <string>Iosevka Curly</string>
      <string>mono-fallback</string>
    </edit>
  </match>
</fontconfig>
