<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
  <match target="pattern">
    <test name="lang">
      <string>zh-hk</string>
    </test>
    <test name="family">
      <string>Source Han Sans CN</string>
    </test>
    <edit name="family" binding="strong">
      <string>Source Han Sans HK</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>zh-tw</string>
    </test>
    <test name="family">
      <string>Source Han Sans CN</string>
    </test>
    <edit name="family" binding="strong">
      <string>Source Han Sans TW</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family">
      <string>Source Han Sans CN</string>
    </test>
    <edit name="family" binding="strong">
      <string>Source Han Sans JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family">
      <string>Source Han Sans CN</string>
    </test>
    <edit name="family" binding="strong">
      <string>Source Han Sans KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>zh-hk</string>
    </test>
    <test name="family">
      <string>Source Han Serif CN</string>
    </test>
    <edit name="family" binding="strong">
      <string>Source Han Serif HK</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>zh-tw</string>
    </test>
    <test name="family">
      <string>Source Han Serif CN</string>
    </test>
    <edit name="family" binding="strong">
      <string>Source Han Serif TW</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family">
      <string>Source Han Serif CN</string>
    </test>
    <edit name="family" binding="strong">
      <string>Source Han Serif JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family">
      <string>Source Han Serif CN</string>
    </test>
    <edit name="family" binding="strong">
      <string>Source Han Serif KR</string>
    </edit>
  </match>
</fontconfig>