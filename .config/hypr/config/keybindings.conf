$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod ALT, B, exec, $HOME/.config/waybar/waybartest.sh


bindd = $mainMod, E,      文件管理器,     exec, $fileManager
bindd = $mainMod, F,      浏览器,         exec, $browser
bindd = $mainMod, T,      终端,           exec, $terminal
bindd = $mainMod, ESCAPE, 任务管理器,     exec, missioncenter
bindd = $mainMod, SPACE,  应用程序启动器, exec, $menu
bindd = $mainMod, A,      截屏,           exec, hyprshot -m region -o $(mktemp -d /tmp/hyprshort-XXXXXX)
bindd = $mainMod, V,      剪贴板,         exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy

bindd = $mainMod, C,      关闭当前窗口,   killactive
bindd = $mainMod, L,      锁屏(Hyprlock), exec, hyprlock
bindd = $mainMod, M,      关闭 Hyprland,  exit

bindd = $mainMod SHIFT, T, 将当前窗口切换为悬浮模式, togglefloating

bindd = $mainMod ALT, R, Fcitx5 重新部署, exec, qdbus6 org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1.SetConfig "fcitx://config/addon/rime/deploy" ""

# 预览多个工作区
bind = $mainMod, G, hyprexpo:expo, toggle

# 切换窗口 mainMod + arrow keys
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# 切换工作区 mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# 将当前窗口移至其它工作区 mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# 创建覆盖层
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# 使用鼠标滚轮在活动工作区间切换 mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# 移动/调整窗口 mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#
bind = $mainMod, period, layoutmsg, move +col
bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod SHIFT, period, layoutmsg, movewindowto r
bind = $mainMod SHIFT, comma, layoutmsg, movewindowto l
bind = $mainMod SHIFT, up, layoutmsg, movewindowto u
bind = $mainMod SHIFT, down, layoutmsg, movewindowto dq

# 音量控制
bindel = ,XF86AudioRaiseVolume,  exec, change-volume --inc
bindel = ,XF86AudioLowerVolume,  exec, change-volume --dec
bindel = ,XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# 亮度控制
bindel = ,XF86MonBrightnessUp,   exec, change-brightness --inc
bindel = ,XF86MonBrightnessDown, exec, change-brightness --dec

# 媒体控制
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous
